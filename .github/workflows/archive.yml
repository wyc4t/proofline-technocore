# Evidence archive: every 10 minutes, keep the Technocore records that are new since the
# last capture. credence is committed to the archive-data branch; kibble is uploaded as
# compressed files to a daily release (kibble-YYYY-MM-DD). Every capture, failure and gap
# is recorded in captures.jsonl on archive-data. Nothing here touches main or the site.
name: Evidence archive

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *' # off the hour; GitHub may still run late or skip a run
  workflow_dispatch:
    inputs:
      passes:
        description: 'Captures to make in this run: 1, or 2 with a wait between them (used by the hourly backstop)'
        default: '1'
      wait_seconds:
        description: 'Seconds between the two captures'
        default: '1500'

permissions:
  contents: write

concurrency:
  group: evidence-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: archive-data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash code/archive/run.sh

      # Started by the hourly backstop: capture again after a wait, so captures stay well
      # inside kibble's shortest observed window (~55 min) even if GitHub's schedule never fires.
      - name: Second capture
        if: ${{ github.event.inputs.passes == '2' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT: ${{ github.event.inputs.wait_seconds }}
        run: |
          case "$WAIT" in ''|*[!0-9]*) WAIT=1500 ;; esac
          [ "$WAIT" -le 2400 ] || WAIT=2400
          sleep "$WAIT"
          git -C data pull -q --rebase origin archive-data
          bash code/archive/run.sh
